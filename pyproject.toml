[build-system]
requires = ['hatchling>=1.25.0', 'hatch-jupyter-builder>=0.5.0', 'jupyter-builder>=1.0.0']
build-backend = 'hatchling.build'

[project]
name = 'jupyterlab-poweroff'
version = '0.2.0'
description = 'Power off or reboot the Linux host from JupyterLab after confirmation'
readme = 'README.md'
license = { file = 'LICENSE' }
requires-python = '>=3.9'
dependencies = [
    'jupyterlab>=4.0.0,<5',
    'jupyter_server>=2.0.0,<3',
]
classifiers = [
    'Framework :: Jupyter',
    'Framework :: Jupyter :: JupyterLab',
    'Framework :: Jupyter :: JupyterLab :: 4',
    'Framework :: Jupyter :: JupyterLab :: Extensions',
    'Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: Python :: 3',
]

[tool.hatch.build.targets.sdist]
include = [
    '/README.md',
    '/LICENSE',
    '/pyproject.toml',
    '/package.json',
    '/src',
    '/jupyterlab_poweroff',
    '/jupyter-config',
    '/install.json',
]

[tool.hatch.build.targets.wheel]
packages = ['jupyterlab_poweroff']

[tool.hatch.build.targets.wheel.shared-data]
'jupyterlab_poweroff/labextension' = 'share/jupyter/labextensions/jupyterlab-poweroff'
'jupyter-config/jupyter_server_config.d/jupyterlab_poweroff.json' = 'etc/jupyter/jupyter_server_config.d/jupyterlab_poweroff.json'
'install.json' = 'share/jupyter/labextensions/jupyterlab-poweroff/install.json'

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ['hatch-jupyter-builder>=0.5.0']
build-function = 'hatch_jupyter_builder.npm_builder'
ensured-targets = [
    'jupyterlab_poweroff/labextension/package.json',
]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = 'build:prod'
npm = ['npm']
